experiment:
  name: lraspp_mobilenetv3_baseline
  seed: 42

dataset:
  root: datasets
  image_size: [240, 320]
  num_classes: 2
  ignore_index: 255

model:
  name: lraspp_mobilenet_v3_large
  pretrained_backbone: true

training:
  epochs: 50
  batch_size: 8
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.0001
  amp: true

scheduler:
  name: cosine
  min_lr: 0.000001

output:
  root: outputs